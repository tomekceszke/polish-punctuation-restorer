name: Deploy website

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache-bust asset links
        run: |
          for page in web/index.html web/alt.html; do
            sed -E -i "s/(style\.css|style-alt\.css|i18n\.js|alt-i18n\.js|model\.js|script\.js)\"/\1?v=${GITHUB_SHA::8}\"/g" "$page"
            # model.js reads this and appends it to every model/ fetch, so a retrained model is never served stale
            sed -E -i "s/(name=\"ppr-build\" content=)\"[^\"]*\"/\1\"${GITHUB_SHA::8}\"/" "$page"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - id: deployment
        uses: actions/deploy-pages@v4
