name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y octave

      - name: Smoke test — labelize
        working-directory: src
        run: |
          octave --norc --no-gui --eval "
            addpath('lib');
            [words, labels] = labelize({'hello', 'world,', 'test.'});
            assert(isequal(words, {'hello', 'world', 'test'}));
            assert(isequal(labels, [1, 2, 3]));
            disp('labelize: OK');
          "

      - name: Smoke test — tokenize (writes temp file)
        working-directory: src
        run: |
          octave --norc --no-gui --eval "
            addpath('lib');
            tmp = tempname();
            fid = fopen(tmp, 'w');
            fprintf(fid, 'Ala ma kota, a kot ma Alę.\n');
            fclose(fid);
            tokens = tokenize(tmp);
            assert(length(tokens) > 0);
            delete(tmp);
            disp('tokenize: OK');
          "

      - name: Smoke test — build_vocab
        working-directory: src
        run: |
          octave --norc --no-gui --eval "
            addpath('lib');
            words = {'a','a','a','b','b','c'};
            vocab = build_vocab(words, 2);
            assert(iscell(vocab));
            assert(length(vocab) == 2);
            assert(strcmp(vocab{1}, 'a'));
            assert(strcmp(vocab{2}, 'b'));
            disp('build_vocab: OK');
          "

      - name: Smoke test — get_word_indices
        working-directory: src
        run: |
          octave --norc --no-gui --eval "
            addpath('lib');
            vocab = {'a', 'b', 'c'};
            words = {'a', 'b', 'z'};
            idx = get_word_indices(words, vocab);
            assert(idx(1) == 1);
            assert(idx(2) == 2);
            assert(idx(3) == 4);
            disp('get_word_indices: OK');
          "

      - name: Smoke test — build_windows
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_build_windows.m
          echo "build_windows: OK"

      - name: Smoke test — mlp_init
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_mlp_init.m
          echo "mlp_init: OK"

      - name: Smoke test — mlp_forward
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_mlp_forward.m
          echo "mlp_forward: OK"

      - name: Smoke test — mlp_loss
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_mlp_loss.m
          echo "mlp_loss: OK"

      - name: Grad check — mlp_backward
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_grad_check.m
          echo "grad_check: OK"

      - name: Smoke test — metrics
        working-directory: src/tests
        run: |
          octave --norc --no-gui test_metrics.m
          echo "metrics: OK"
